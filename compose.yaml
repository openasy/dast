# DAST and one dast-agent. The agent runs ZAP and Nuclei against targets proven to be yours, by hand or on a schedule;
# CI can send SARIF reports too, and gets back whether the check passes (ADR 0037).
#
#   openssl rand -hex 32 > openasy-kek         # dast's key: sign-in secrets (ADR 0021)
#   openssl rand -hex 32 > openasy-agent-kek   # the agent's key: its own secret. Keep both with your backups
#   docker compose up -d dast
#   # Agents, Add agent, then:
#   DAST_ENROLL_TOKEN=ode_... docker compose up -d dast-agent
#   docker compose logs dast | grep 'no owner yet'   # the one-time link that creates the owner account
services:
  dast:
    image: ghcr.io/openasy/dast:0.8.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8080:8080" # UI and API; put a TLS proxy in front to reach it from elsewhere
    volumes:
      - dast-data:/data # SQLite database: targets, reports, findings and decisions
      # - ./inventory:/config/inventory:ro   # the install's endpoints, shared with Uptime and Certificates: its targets
    secrets:
      - openasy-kek # mounted at /run/secrets/openasy-kek
    environment:
      # The address people open DAST at; with a TLS proxy in front, its https:// URL.
      DAST_PUBLIC_URL: ${DAST_PUBLIC_URL:-http://localhost:8080}
      # For CI: it can send reports and nothing else. Or use an API token with the editor role from Settings.
      DAST_INGEST_TOKEN: ${DAST_INGEST_TOKEN:-}
      # The targets: the entries of the endpoints file with a dast block (ADR 0052), and the secret a login names, from .env:
      # OPENASY_ENDPOINTS: /config/inventory/endpoints.yaml
      # DAST_SHOP_PASSWORD: ${DAST_SHOP_PASSWORD}
      # Sign in with your identity provider (OIDC), see the README:
      # OPENASY_OIDC_ISSUER: https://login.example.com
      # OPENASY_OIDC_CLIENT_ID: dast
      # OPENASY_OIDC_CLIENT_SECRET: ${OPENASY_OIDC_CLIENT_SECRET}

  dast-agent:
    image: ghcr.io/openasy/dast-agent:0.8.0 # always the same version as dast
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=1g"] # ZAP's and Nuclei's home for one scan
    mem_limit: 3g
    volumes:
      - dast-agent-data:/data # its secret, sealed with its own key
    secrets:
      - source: openasy-agent-kek
    environment:
      DAST_URL: http://dast:8080
      # One-time, from Agents; only needed for the first start.
      DAST_ENROLL_TOKEN: ${DAST_ENROLL_TOKEN:-}
    depends_on: [dast]

volumes:
  dast-data:
  dast-agent-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
  openasy-agent-kek:
    file: ./openasy-agent-kek
