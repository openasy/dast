# DAST. CI sends SARIF reports from ZAP or Nuclei and gets back whether the check passes (ADR 0037).
#
#   openssl rand -hex 32 > openasy-kek   # dast's key: sign-in secrets (ADR 0021). Keep it with your backups
#   docker compose up -d
#   docker compose logs dast | grep 'no owner yet'   # the one-time link that creates the owner account
services:
  dast:
    image: ghcr.io/openasy/dast:0.2.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8080:8080" # UI and API; put a TLS proxy in front to reach it from elsewhere
    volumes:
      - dast-data:/data # SQLite database: targets, reports, findings and decisions
    secrets:
      - openasy-kek # mounted at /run/secrets/openasy-kek
    environment:
      # The address people open DAST at; with a TLS proxy in front, its https:// URL.
      DAST_PUBLIC_URL: ${DAST_PUBLIC_URL:-http://localhost:8080}
      # For CI: it can send reports and nothing else. Or use an API token with the editor role from Settings.
      DAST_INGEST_TOKEN: ${DAST_INGEST_TOKEN:-}
      # Sign in with your identity provider (OIDC), see the README:
      # OPENASY_OIDC_ISSUER: https://login.example.com
      # OPENASY_OIDC_CLIENT_ID: dast
      # OPENASY_OIDC_CLIENT_SECRET: ${OPENASY_OIDC_CLIENT_SECRET}

volumes:
  dast-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
